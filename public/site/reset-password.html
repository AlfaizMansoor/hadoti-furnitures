<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Hadoti Furnitures</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="./index.html">
      <strong>Hadoti</strong>
      <span>Furnitures</span>
    </a>
    <nav class="header-actions">
      <a href="./index.html" aria-label="Home" title="Home">&#8962;</a>
      <a href="./auth.html" data-account-link aria-label="Login" title="Login">&#9679;</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>Set a New Password</h1>
    <p>Choose a new password for your account below.</p>
  </div>

  <div class="auth-layout">
    <div class="auth-card">
      <form class="form" id="reset-form">
        <label>New Password
          <input type="password" name="password" required minlength="6" autocomplete="new-password">
        </label>
        <label>Confirm New Password
          <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
        </label>
        <button class="btn" type="submit">Update Password</button>
      </form>
      <p class="form-message" id="reset-message"></p>
    </div>

    <aside class="contact-card">
      <h3>Need help?</h3>
      <div data-contact-block></div>
    </aside>
  </div>
</main>

<footer class="site-footer" data-site-footer></footer>

<script type="module" src="./js/reset-password.js"></script>
<script type="module" src="./js/password-toggle.js"></script>
<script type="module" src="./js/site-info.js"></script>
</body>
</html>
