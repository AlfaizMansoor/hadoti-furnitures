<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Hadoti Furnitures</title>
  <meta name="description" content="Get in touch with Hadoti Furnitures — questions about an order, a custom piece, or anything else.">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/site/index.html">
      <strong>Hadoti</strong>
      <span>Furnitures</span>
    </a>
    <nav class="header-actions">
      <a href="/site/index.html" aria-label="Home" title="Home">&#8962;</a>
      <a href="/site/catalog.html" aria-label="Catalog" title="Catalog">&#9638;</a>
      <a href="/site/wishlist.html" class="always" aria-label="Wishlist" title="Wishlist">&#9825;<span class="count" data-wishlist-count>0</span></a>
      <a href="/site/cart.html" class="always" aria-label="Cart" title="Cart">&#128722;<span class="count" data-cart-count>0</span></a>
      <a href="/site/auth.html" data-account-link aria-label="Login" title="Login">&#9679;</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>Contact Us</h1>
    <p>Questions about an order, a custom piece, or anything else — send us a message.</p>
  </div>

  <div class="auth-layout">
    <div class="auth-card">
      <form class="form" id="contact-form">
        <label>Full Name
          <input type="text" name="name" required autocomplete="name">
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Phone (optional)
          <input type="tel" name="phone" autocomplete="tel">
        </label>
        <label>Message
          <textarea name="message" rows="5" required></textarea>
        </label>
        <button class="btn" type="submit">Send Message</button>
      </form>
      <p class="form-message" id="contact-message"></p>
    </div>

    <aside class="contact-card">
      <h3>Reach us directly</h3>
      <div data-contact-block></div>
    </aside>
  </div>

  <div data-map-block style="margin-top:32px"></div>
</main>

<footer class="site-footer" data-site-footer></footer>

<nav class="mobile-nav">
  <a href="/site/index.html" aria-label="Home"><b>&#8962;</b></a>
  <a href="/site/catalog.html" aria-label="Catalog"><b>&#9638;</b></a>
  <a href="/site/wishlist.html" aria-label="Wishlist"><b>&#9825;</b></a>
  <a href="/site/cart.html" aria-label="Cart"><b>&#128722;</b></a>
  <a href="/site/auth.html" data-account-link aria-label="Login"><b>&#9679;</b></a>
</nav>

<script type="module" src="/site/js/contact-form.js"></script>
<script type="module" src="/site/js/site-info.js"></script>
<script type="module" src="/site/js/mobile-nav.js"></script>
</body>
</html>
