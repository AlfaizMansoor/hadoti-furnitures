name: Deploy Static Content to Pages

on:
  push:
    branches: 
        - main # Change to "master" if your default branch is named master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Optional: Uncomment the lines below if you are using an npm build framework (Vite, React, etc.)
      # - name: Install Dependencies & Build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # FIXED PATH: Points to the directory containing your static files.
          # If your files are in the repository root, change this to "."
          # If they are inside a folder named public, change this to "public"
          path: "." 

  # Continuous Deployment Job
  deploy-pages:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    